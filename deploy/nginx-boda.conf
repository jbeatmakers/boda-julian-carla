# Producción. Requiere certificados de Let's Encrypt para ambos nombres.
server {
    listen 443 ssl http2;
    server_name boda-julian-carla.bpm.red;
    root /opt/boda-julian-carla/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/boda-julian-carla.bpm.red/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boda-julian-carla.bpm.red/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src https://www.google.com; connect-src 'self' https://boda-api.bpm.red; img-src 'self' data: https://*.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'self'" always;

    location / { try_files $uri $uri/ /index.html; }
    location = /admin.html { return 302 https://boda-api.bpm.red/; }
    location /api/ { proxy_pass http://127.0.0.1:8787; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
    location = /healthz { proxy_pass http://127.0.0.1:8787/healthz; }
}

server {
    listen 443 ssl http2;
    server_name boda-api.bpm.red;
    root /opt/boda-julian-carla/admin;
    index admin.html;

    ssl_certificate /etc/letsencrypt/live/boda-api.bpm.red/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boda-api.bpm.red/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / { try_files $uri $uri/ /admin.html; }
    location /api/ { proxy_pass http://127.0.0.1:8787; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
    location = /healthz { proxy_pass http://127.0.0.1:8787/healthz; }
}

server {
    listen 80;
    server_name boda-julian-carla.bpm.red boda-api.bpm.red;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
