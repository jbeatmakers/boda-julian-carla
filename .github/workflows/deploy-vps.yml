name: Validate wedding release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boda-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax and tests
        run: |
          python -m py_compile server/app.py server/backup.py
          node --check assets/app.js
          node --check assets/admin.js
          node tests/test_config_loading.cjs
          node tests/test_updates.cjs
          python -m unittest discover -s tests -v
