name: Wedding production diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify published source, live database health and canonical CORS
        run: python tools/check_production.py --wait 30
      - name: Install pinned browser verifier
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Verify canonical BODA and connection recovery without changing guest data
        run: python tests/browser_access.py --base https://bodajulianycarla.bpm.red --output browser-results-diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-browser-evidence
          path: browser-results-diagnostic.json
          retention-days: 7
